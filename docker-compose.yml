name: icc

x-app-env: &app-env
  DATABASE_URL: postgresql://icc:icc@postgres:5432/icc
  REDIS_URL: redis://redis:6379
  APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?set APP_ENCRYPTION_KEY in .env}
  APP_URL: ${APP_URL:-http://localhost:3000}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  UPLOAD_DIR: /data/uploads
  S3_ENDPOINT: http://minio:9000
  WEB_INTERNAL_URL: http://web:3000 # resume PDFs: the API's headless browser prints the web app's /print/resume page
  S3_BUCKET: ${S3_BUCKET:-icc}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-icc}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-icc-local-secret}
  AGENT_WORKSPACE_DIR: /agent-workspace/tasks
  LLM_ENABLED: ${LLM_ENABLED:-false}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-}
  LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-120000}
  LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
  LLM_DEFAULT_TEMPERATURE: ${LLM_DEFAULT_TEMPERATURE:-0.2}
  LLM_ALLOW_PRIVATE_NETWORK: ${LLM_ALLOW_PRIVATE_NETWORK:-true}
  LLM_EXTERNAL_DATA_CONSENT: ${LLM_EXTERNAL_DATA_CONSENT:-false}
  AGENT_CLAUDE_CLI_ENABLED: ${AGENT_CLAUDE_CLI_ENABLED:-false}
  AGENT_CLAUDE_CLI_TIMEOUT_MS: ${AGENT_CLAUDE_CLI_TIMEOUT_MS:-900000}
  SMTP_URL: ${SMTP_URL:-}
  MAIL_FROM: ${MAIL_FROM:-icc@localhost}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: icc
      POSTGRES_PASSWORD: icc
      POSTGRES_DB: icc
    ports: ["127.0.0.1:5434:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U icc"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6380:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  minio:
    # MinIO RELEASE.2024-10-13 built by Bitnami: minio/minio is no longer published on Docker Hub or quay.io
    image: bitnamilegacy/minio:2024.10.13
    # starts as root only to chown the data folder (volumes made by the old minio/minio image are root-owned), then runs MinIO as its own user
    user: root
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-icc}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-icc-local-secret}
    ports: ["127.0.0.1:9010:9000", "127.0.0.1:9011:9001"] # S3 API, web console
    volumes: [miniodata:/bitnami/minio/data]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 5s
      retries: 20

  api:
    build: { context: ., target: api }
    image: icc-api:latest
    environment: *app-env
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/main.js"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    volumes: [appdata:/data, ./agent-workspace:/agent-workspace]
    extra_hosts: ["host.docker.internal:host-gateway"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      retries: 10

  worker:
    image: icc-api:latest # same image as the API, different command
    environment:
      <<: *app-env
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-} # only the worker runs claude; from `claude setup-token`
    # install/refresh the agent skill pack into ./agent-workspace, then start the worker
    command: ["sh", "-c", "node skills/install.mjs /agent-workspace && node dist/worker.js"]
    depends_on:
      api: { condition: service_healthy }
    volumes: [appdata:/data, ./agent-workspace:/agent-workspace]
    extra_hosts: ["host.docker.internal:host-gateway"]

  web:
    build: { context: ., target: web }
    image: icc-web:latest
    environment:
      API_INTERNAL_URL: http://api:4000
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: { condition: service_healthy }

  # Headless apply runner for servers: applies to approved jobs on its own. Off unless COMPOSE_PROFILES=runner and
  # ICC_RUNNER_TOKEN (Auto Apply → Settings → Runner tokens) are set in .env. Auto-submit vs fill-only follows your settings.
  apply-runner:
    profiles: [runner]
    build: { context: ., target: runner }
    image: icc-runner:latest
    environment:
      ICC_API_URL: http://api:4000
      ICC_RUNNER_TOKEN: ${ICC_RUNNER_TOKEN:-}
      APPLY_RUNNER_HEADLESS: "true"
      APPLY_RUNNER_POLL_MS: ${APPLY_RUNNER_POLL_MS:-60000}
    init: true # reaps Chromium's child processes
    shm_size: 1gb # Chromium needs more than Docker's 64 MB /dev/shm
    stop_grace_period: 2m # finish the current application before stopping
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  appdata:
  miniodata:
